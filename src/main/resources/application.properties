# Configuração do Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

# Nome da aplicação
spring.application.name=monitoramento-desempenho-api

# Força UTF-8 nas respostas HTTP (StringHttpMessageConverter usa ISO-8859-1 por padrão)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Configurações do banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/monitoramento-desempenho-api
spring.datasource.username=postgres
spring.datasource.password=postgres

# Configurações do JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Configuração do Token JWT
api.security.token.secret=${JWT_SECRET_KEY}
